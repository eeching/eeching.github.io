    - title: Postdoctoral Scholar
      institution: Stanford University, Computer Science
      year: 2026-Present
      description:
        - Working with Prof. Jiajun Wu
        - Developing structured interfaces for generalist robot policies, with a focus on human–VLA communication, explicit concept memory, compositional skill chaining, and adaptive planning and policy steering.

    - title: Research Intern
      institution: Allen Institute for Artificial Intelligence (AI2), Robotics (Seattle)
      year: 2025-2026
      description:
        - Working with Prof. Dieter Fox
        - Developed methods for task and goal specification for robot foundation models, studying how human objectives can be represented, grounded, and translated into robot-executable behavior.

    - title: Visiting Ph.D. Student
      institution: CSAIL, MIT
      year: 2023-2024
      description:
        - Advised by Prof. Leslie Kaelbling and Prof. Tomás Lozano-Pérez
        - Developed "Set It Up!", a neuro-symbolic system that interprets and optimizes under-specified instructions for tabletop arrangements using very few demonstrations. Published at RSS 2024.

